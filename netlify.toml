# Déploiement Netlify.
# - command : sans elle, Netlify ne lance pas de build (« No build steps found ») et publie un dossier vide (404).
# - publish : le dossier .next produit par le build, que l'intégration Next.js empaquette.
# - plugin : l'intégration Next.js de Netlify (runtime OpenNext), déclarée explicitement pour qu'elle
#   s'exécute même si la détection automatique échoue. Elle sert les pages, les images et /api/contact.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"
